<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">Perpustakaan</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#" class="active">Beranda</a></li>
                <li><a href="#">Katalog</a></li>
                <li><a href="#">Koleksi</a></li>
                <li><a href="#">Tentang</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="search-box">
                <input type="text" placeholder="Cari buku...">
                <button class="search-btn">🔍</button>
            </div>
        </div>
    </section>

    <!-- Featured Books -->
    <section class="featured">
        <div class="container">
            <h2 class="section-title">Buku Unggulan</h2>
            <div class="books-grid">
                <div class="book-card">
                    <div class="book-cover" style="background: linear-gradient(135deg, #8B9A6E 0%, #6B7A4E 100%);">
                        <span class="book-title">The Bluean</span>
                    </div>
                    <h3>The Bluean</h3>
                    <p class="author">Penulis A</p>
                </div>
                <div class="book-card">
                    <div class="book-cover" style="background: linear-gradient(135deg, #A8B89E 0%, #8B9A6E 100%);">
                        <span class="book-title">Oakla</span>
                    </div>
                    <h3>Oakla</h3>
                    <p class="author">Penulis B</p>
                </div>
                <div class="book-card">
                    <div class="book-cover" style="background: linear-gradient(135deg, #6B7A4E 0%, #4A5A2E 100%);">
                        <span class="book-title">Ortkef</span>
                    </div>
                    <h3>Ortkef</h3>
                    <p class="author">Penulis C</p>
                </div>
                <div class="book-card">
                    <div class="book-cover" style="background: linear-gradient(135deg, #8B9A6E 0%, #A8B89E 100%);">
                        <span class="book-title">Subdohr</span>
                    </div>
                    <h3>Subdohr</h3>
                    <p class="author">Penulis D</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories">
        <div class="container">
            <div class="category-grid">
                <button class="category-btn">Fiksi</button>
                <button class="category-btn">Non-Fiksi</button>
                <button class="category-btn">Anak</button>
                <button class="category-btn">Referensi</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Perpustakaan Digital. Semua hak dilindungi.</p>
            <p>Dibuat dengan ❤️ untuk pecinta buku</p>
        </div>
    </footer>
</body>

</html>
